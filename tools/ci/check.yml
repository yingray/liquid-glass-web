name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.48.0 pillow
          python -m playwright install --with-deps chromium
      - name: Generated files are up to date
        run: |
          make build
          git diff --exit-code -- design-system || (echo "::error::Run 'make build' and commit the regenerated files." && exit 1)
      - name: Contrast, Apple rules, interaction tests
        run: make check
