# Runs every check on each pull request and each push to main:
# generated files are up to date, contrast, the Apple rule audit, interaction tests, behaviour contracts,
# the Claude Design React adapter build and its contracts. All browser checks run in headless Chromium.
name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/check.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright (Chromium)
        run: |
          pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Install the design-sync toolchain for the React checks
        # Same versions as the local .ds-sync/node_modules; the folder is not in git.
        run: npm install --no-save --no-package-lock --prefix .ds-sync react@18.3.1 react-dom@18.3.1 esbuild@0.28.2
      - name: Generated files are up to date
        run: |
          make build PY=python
          git diff --exit-code -- design-system || (echo "::error::Run 'make build' and commit the regenerated files." && exit 1)
      - name: Contrast, Apple rule audit, interaction tests, behaviour contracts
        run: make check PY=python
      - name: React adapter builds
        run: node .design-sync/react/build.mjs
      - name: React adapter contracts
        # The script skips when the toolchain is missing; in CI a skip is a failure.
        run: |
          python tools/react_contracts.py | tee react-contracts.log
          if grep -q '^SKIP' react-contracts.log; then echo "::error::React contracts were skipped"; exit 1; fi
